services:
  - type: web
    name: mansah
    env: node
    plan: free
    buildCommand: npm ci && npm run build
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_DB
        value: manasah
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false

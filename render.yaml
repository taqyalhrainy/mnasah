services:
  - type: web
    name: mansah
    env: node
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_DB
        value: manasah
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      # Use the same OAuth 2.0 Web Client ID in both variables.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false

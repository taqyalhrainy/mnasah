services:
  - type: web
    name: emtidad-alelm
    env: node
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_DB
        value: manasah
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: PLATFORM_COMMISSION_PERCENT
        value: 10
      - key: PASSWORD_RESET_SECRET
        generateValue: true
      # Vonage Verify is the primary SMS/OTP provider. Twilio remains an optional fallback.
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      # Configure Resend for email recovery, or use the phone provider for SMS recovery.
      - key: RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Use the same OAuth 2.0 Web Client ID in both variables.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # TURN is required for reliable video/audio across different networks.
      - key: VITE_TURN_URLS
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false
      # Web Push: generate once with `npx web-push generate-vapid-keys` and keep the private key secret.
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        value: mailto:support@emtidad-alelm.onrender.com

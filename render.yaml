services:
  - type: web
    name: mansah
    env: node
    plan: free
    buildCommand: npm ci && npm run build:backend
    startCommand: npm start
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_USER
        sync: false
      - key: MONGODB_PASSWORD
        sync: false
      - key: MONGODB_DB
        value: manasah
      - key: OWNER_SETUP_TOKEN
        generateValue: true
      - key: CLIENT_ORIGIN
        sync: false
      - key: PLATFORM_COMMISSION_PERCENT
        value: 10
      - key: PASSWORD_RESET_SECRET
        generateValue: true
      # Configure Resend for email recovery, or Twilio for SMS recovery.
      - key: RESEND_API_KEY
        sync: false
      - key: PASSWORD_RESET_FROM
        sync: false
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Use the same OAuth 2.0 Web Client ID in both variables.
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      # TURN is required for reliable video/audio across different networks.
      - key: VITE_TURN_URLS
        sync: false
      - key: VITE_TURN_USERNAME
        sync: false
      - key: VITE_TURN_CREDENTIAL
        sync: false

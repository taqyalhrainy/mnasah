      // Recover an outdated HTML/chunk pair once, then show an actionable fallback.
      window.addEventListener('vite:preloadError', function(event) {
        event.preventDefault();
        var last = Number(sessionStorage.getItem('asset-recovery') || 0);
        if (Date.now() - last > 60000) { sessionStorage.setItem('asset-recovery', String(Date.now())); location.reload(); }
      });
      setTimeout(function() {
        var boot = document.querySelector('.boot-loading__content');
        if (!boot) return;
        var retry = document.createElement('button');
        retry.textContent = document.documentElement.lang === 'en' ? 'Retry loading' : 'إعادة التحميل';
        retry.onclick = function() { location.reload(); };

      }, 15000);

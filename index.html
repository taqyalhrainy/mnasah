<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#ffffff" />
    <script>
      try {
        var lang = localStorage.getItem('mansah-language') === 'en' ? 'en' : 'ar';
        var theme = localStorage.getItem('mansah-theme') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.lang = lang;
        document.documentElement.dir = lang === 'ar' ? 'rtl' : 'ltr';
        document.documentElement.dataset.theme = theme === 'dark' ? 'dark' : 'light';
        document.documentElement.style.colorScheme = theme === 'dark' ? 'dark' : 'light';
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
    </script>
    <link rel="manifest" href="%BASE_URL%manifest.webmanifest" />
    <link rel="icon" href="%BASE_URL%icon.svg" type="image/svg+xml" />
    <style>
      html,body,#root{min-height:100%;margin:0}body{font-family:Tahoma,Arial,sans-serif;background:#fff;color:#171717}.boot-loading{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}.boot-loading__content{display:grid;justify-items:center;gap:14px;text-align:center}.boot-loading img{width:58px;height:58px;border-radius:12px}.boot-loading i{width:38px;height:38px;border:4px solid #e9e3ce;border-top-color:#e2b91f;border-radius:50%;animation:boot-spin .8s linear infinite}.boot-loading strong{font-size:26px}.boot-loading p{margin:0;color:#6b7280}html[data-theme=dark] body{background:#1d1428;color:#fff}html[data-theme=dark] .boot-loading p{color:#c9bed2}html[data-theme=dark] .boot-loading i{border-color:#4a3a57;border-top-color:#f2cf52}@keyframes boot-spin{to{transform:rotate(360deg)}}@media(prefers-reduced-motion:reduce){.boot-loading i{animation:none}}
    </style>
    <title>امتداد | منصة تعليم خصوصي</title>
  </head>
  <body>
    <div id="root"><main class="boot-loading" role="status" aria-live="polite"><div class="boot-loading__content"><img src="%BASE_URL%icon.svg" alt="" /><i aria-hidden="true"></i><strong>امتداد</strong><p>جارٍ تحميل منصتك...</p></div></main></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

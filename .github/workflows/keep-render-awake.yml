name: Keep Render Awake

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: keep-render-awake
  cancel-in-progress: true

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    strategy:
      matrix:
        host: [emtidad-alelm.onrender.com, emtidad-alelm-owner.onrender.com]
    steps:
      - name: Check current platform health
        run: curl --fail --silent --show-error --max-time 60 --retry 1 --retry-delay 5 https://${{ matrix.host }}/health
